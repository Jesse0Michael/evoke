name: Tag
on:
  push:
    branches:
      - main

jobs:
  build:
    name: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release reads the full tag + commit history to pick the next version.
          fetch-depth: 0

      - name: Semantic Release
        uses: ridedott/release-me-action@v3
        with:
          release-branches: '["main"]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
