version: "2"

linters:
  exclusions:
    # golangci-lint v2 dropped v1's default exclusions. This preset restores them:
    # unchecked fmt.Fprint* to stdout/stderr and the like, where there is no
    # meaningful recovery and the CLI is already writing to a terminal.
    presets:
      - std-error-handling
    paths:
      - internal/ent # generated by `go tool ent generate`
      - internal/client # generated by `go tool oapi-codegen`
